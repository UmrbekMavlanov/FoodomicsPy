[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "foodomicspy"
version = "0.1.0"
description = "Python tools for foodomics, spectroscopy, and chemometrics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Umrbek Mavlanov" }
]

keywords = [
    "foodomics",
    "chemometrics",
    "spectroscopy",
    "FTIR",
    "NMR",
    "PCA",
    "PLS",
    "food science"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.0",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "h5py>=3.8",
    "nmrglue>=0.10",
    "brukeropusreader"
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0"
]


[project.urls]
Homepage = "https://github.com/UmrbekMavlanov/FoodomicsPy"
Documentation = "https://github.com/UmrbekMavlanov/FoodomicsPy#readme"
Repository = "https://github.com/UmrbekMavlanov/FoodomicsPy"
Issues = "https://github.com/UmrbekMavlanov/FoodomicsPy/issues"


[tool.setuptools.packages.find]
where = ["src"]